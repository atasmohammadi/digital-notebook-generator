<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>mortalpages Digital Journal</title>
  <link rel="stylesheet" href="theme_variables.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="page">
    <!-- Left Navigation Spine (14 Tabs) -->
    <aside class="sidebar">
      <div class="tab {{ACTIVE_HOME}}" data-dest="home" title="Home Index">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
          <polyline points="9 22 9 12 15 12 15 22"/>
        </svg>
      </div>
      <!-- 12 Chapters -->
      <div class="tab {{ACTIVE_CH1}}" data-dest="ch1">1</div>
      <div class="tab {{ACTIVE_CH2}}" data-dest="ch2">2</div>
      <div class="tab {{ACTIVE_CH3}}" data-dest="ch3">3</div>
      <div class="tab {{ACTIVE_CH4}}" data-dest="ch4">4</div>
      <div class="tab {{ACTIVE_CH5}}" data-dest="ch5">5</div>
      <div class="tab {{ACTIVE_CH6}}" data-dest="ch6">6</div>
      <div class="tab {{ACTIVE_CH7}}" data-dest="ch7">7</div>
      <div class="tab {{ACTIVE_CH8}}" data-dest="ch8">8</div>
      <div class="tab {{ACTIVE_CH9}}" data-dest="ch9">9</div>
      <div class="tab {{ACTIVE_CH10}}" data-dest="ch10">10</div>
      <div class="tab {{ACTIVE_CH11}}" data-dest="ch11">11</div>
      <div class="tab {{ACTIVE_CH12}}" data-dest="ch12">12</div>
      <!-- Template Directory at Bottom -->
      <div class="tab {{ACTIVE_TEMPLATES}}" data-dest="templates" title="Template List">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect width="18" height="18" x="3" y="3" rx="2"/>
          <path d="M3 9h18"/>
          <path d="M9 21V9"/>
        </svg>
      </div>
    </aside>

    <!-- Main Content Canvas -->
    <main class="content-area">
      {{HEADER}}
      <section class="page-body">
        {{CONTENT}}
      </section>
      <footer class="page-footer">
        {{FOOTER}}
      </footer>
    </main>
  </div>
</body>
</html>
