<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Notebook Cover</title>
  <link rel="stylesheet" href="../Base/theme_variables.css">
  <link rel="stylesheet" href="../Base/styles.css">
  <style>
    .cover-canvas {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      background: var(--page-bg);
    }
    .cover-card {
      width: 520px;
      height: 680px;
      border: 1px solid var(--border-subtle);
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.6);
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.05);
      backdrop-filter: blur(10px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px 40px;
      text-align: center;
    }
    .cover-title {
      font-family: var(--font-serif);
      font-size: 42px;
      font-weight: 400;
      letter-spacing: 3px;
      color: var(--text-main);
      margin-bottom: 12px;
    }
    .cover-divider {
      width: 60px;
      height: 2px;
      background-color: var(--accent-color);
      margin: 20px 0;
    }
    .cover-subtitle {
      font-family: var(--font-heading);
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--text-secondary);
    }
    .cover-footer-text {
      position: absolute;
      bottom: 40px;
      font-family: var(--font-heading);
      font-size: 13px;
      letter-spacing: 2px;
      color: var(--watermark-color);
    }
  </style>
</head>
<body>
  <div class="page" style="width: 1152px; height: 1485px;">
    <div class="cover-canvas">
      <div class="cover-card">
        <h1 class="cover-title">Digital Journal</h1>
        <div class="cover-divider"></div>
        <p class="cover-subtitle">Interactive Planner & Notebook</p>
      </div>
      <div class="cover-footer-text">mortalpages.com</div>
    </div>
  </div>
</body>
</html>
