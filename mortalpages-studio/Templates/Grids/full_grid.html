<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Full Grid</title>
  <link rel="stylesheet" href="../Base/theme_variables.css">
  <link rel="stylesheet" href="../Base/styles.css">
  <style>
    .grid-container {
      flex: 1;
      width: 100%;
      height: 100%;
      border-radius: 6px;
      border: 1px solid var(--border-subtle);
      background-size: var(--grid-size) var(--grid-size);
      background-image:
        linear-gradient(to right, var(--grid-color) 1px, transparent 1px),
        linear-gradient(to bottom, var(--grid-color) 1px, transparent 1px);
    }
  </style>
</head>
<body>
  <div class="page">
    <aside class="sidebar">
      <div class="tab" data-dest="home"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg></div>
      <div class="tab" data-dest="ch1">1</div><div class="tab" data-dest="ch2">2</div><div class="tab" data-dest="ch3">3</div>
      <div class="tab" data-dest="ch4">4</div><div class="tab" data-dest="ch5">5</div><div class="tab" data-dest="ch6">6</div>
      <div class="tab" data-dest="ch7">7</div><div class="tab" data-dest="ch8">8</div><div class="tab" data-dest="ch9">9</div>
      <div class="tab" data-dest="ch10">10</div><div class="tab" data-dest="ch11">11</div><div class="tab" data-dest="ch12">12</div>
      <div class="tab active" data-dest="templates"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M3 9h18"/><path d="M9 21V9"/></svg></div>
    </aside>

    <main class="content-area">
      <header class="page-header">
        <h1 class="page-title">Full Grid</h1>
        <p class="page-subtitle">Standard 5mm Squared Notes</p>
      </header>

      <div class="page-body">
        <div class="grid-container"></div>
      </div>

      <footer class="page-footer">
        <div class="watermark-plaque">mortalpages.com</div>
      </footer>
    </main>
  </div>
</body>
</html>
