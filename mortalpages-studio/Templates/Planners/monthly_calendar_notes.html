<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Monthly Planner</title>
  <link rel="stylesheet" href="../Base/theme_variables.css">
  <link rel="stylesheet" href="../Base/styles.css">
  <style>
    .planner-layout {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .calendar-header-row {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 8px;
      text-align: center;
      font-family: var(--font-heading);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 1px;
      color: var(--text-secondary);
      text-transform: uppercase;
      padding-bottom: 6px;
      border-bottom: 2px solid var(--border-medium);
    }
    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      grid-template-rows: repeat(5, 1fr);
      gap: 8px;
      flex: 3;
    }
    .calendar-cell {
      border: 1px solid var(--border-subtle);
      border-radius: 6px;
      padding: 6px 8px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background: rgba(255, 255, 255, 0.4);
    }
    .day-num {
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
    }
    .planner-bottom-row {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    .notes-box {
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      padding: 14px;
      display: flex;
      flex-direction: column;
    }
    .box-title {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--text-secondary);
      margin-bottom: 8px;
    }
    .lined-notes-bg {
      flex: 1;
      background-size: 100% 20px;
      background-image: linear-gradient(to bottom, transparent 19px, var(--line-color) 1px);
    }
  </style>
</head>
<body>
  <div class="page">
    <aside class="sidebar">
      <div class="tab" data-dest="home"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg></div>

      <div class="tab" data-dest="ch4">4</div><div class="tab" data-dest="ch5">5</div><div class="tab" data-dest="ch6">6</div>

      <div class="tab" data-dest="ch10">10</div><div class="tab" data-dest="ch11">11</div><div class="tab" data-dest="ch12">12</div>
